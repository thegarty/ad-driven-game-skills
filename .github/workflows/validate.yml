name: Validate library

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/validate_library.py
      - run: python -m unittest discover -s tests -v
      - run: python evals/harnesses/ad_reward_model.py -v
      - name: Check isolated install
        run: |
          python scripts/install.py --dest "$RUNNER_TEMP/ad-game-skills" --dry-run
          python scripts/install.py --dest "$RUNNER_TEMP/ad-game-skills"
          python scripts/install.py --dest "$RUNNER_TEMP/ad-game-skills" --update
          python scripts/install.py --list-profiles
          python scripts/install.py --dest "$RUNNER_TEMP/ad-game-ui" --profile design-ui --dry-run
          python scripts/install.py --dest "$RUNNER_TEMP/ad-game-ui" --profile design-ui
          python scripts/install.py --dest "$RUNNER_TEMP/ad-game-ui" --profile design-ui --update
